name: Fetch images from old Google Site
on:
  push:
    paths: [".github/workflows/fetch-images.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          set +e
          mkdir -p images/old-site
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          code=$(curl -sSL -A "$UA" -o page.html -w "%{http_code} %{url_effective}" "https://sites.google.com/view/mgmayank18/home")
          echo "page: $code" > images/old-site/manifest.txt
          grep -oE 'https://(lh[0-9]+\.googleusercontent\.com|sites\.google\.com/sitesv-images-rt)/[^"'"'"' )\\]+' page.html | sed 's/&amp;/\&/g' | awk '!seen[$0]++' > urls.txt
          echo "found $(wc -l < urls.txt) urls" >> images/old-site/manifest.txt
          n=0
          while read -r u; do
            n=$((n+1))
            c=$(curl -sSL -A "$UA" -e "https://sites.google.com/" -o "images/old-site/img-$n" -w "%{http_code} %{content_type} %{size_download}" "$u")
            echo "img-$n $c $u" >> images/old-site/manifest.txt
          done < urls.txt
          cat images/old-site/manifest.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Add images from old Google Site" || echo "nothing to commit"
          git push
